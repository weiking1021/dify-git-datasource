identity:
  author: weiking1021
  name: git
  label:
    en_US: Git Repository
    zh_Hans: Git 倉庫
  icon: icon.svg
description:
  en_US: List and fetch files from a git repository as Knowledge Pipeline pages.
  zh_Hans: 列出並抓取 git 倉庫中的檔案，作為 Knowledge Pipeline 的資料頁面。

parameters:
  - name: repo_url
    type: string
    required: true
    label:
      en_US: Repository URL
      zh_Hans: 倉庫網址
    placeholder:
      en_US: "https://github.com/org/repo.git or git@gitlab.example.com:org/repo.git"
      zh_Hans: "https://github.com/org/repo.git 或 git@gitlab.example.com:org/repo.git"
    description:
      en_US: HTTPS URL for a public repository, or an SSH URL / scp-like address (git@host:org/repo.git) for a private repository accessed via the configured deploy key.
      zh_Hans: 公開倉庫請填 HTTPS 網址；私有倉庫請填 SSH 網址或 scp 簡寫格式（git@host:org/repo.git），並搭配已設定的 deploy key。
  - name: branch
    type: string
    required: false
    default: HEAD
    label:
      en_US: Branch or ref
      zh_Hans: 分支
    placeholder:
      en_US: main
      zh_Hans: main
    description:
      en_US: Branch to sync. Leave as HEAD to use the repository's default branch.
      zh_Hans: 要同步的分支，留空或填 HEAD 表示使用倉庫預設分支。
  - name: extension_filter
    type: string
    required: false
    default: ".md,.mdx,.txt"
    label:
      en_US: "File extensions to include (comma-separated, e.g. .md,.mdx,.txt)"
      zh_Hans: "要包含的檔案副檔名（逗號分隔，例如 .md,.mdx,.txt）"
    placeholder:
      en_US: ".md,.mdx,.txt,.py"
      zh_Hans: ".md,.mdx,.txt,.py"
    description:
      en_US: Each extension must start with a dot, no spaces, no wildcards. Leave empty to include every extension.
      zh_Hans: 每個副檔名都要有開頭的點，不要加空格，不支援萬用字元。留空表示不限制副檔名。
  - name: path_filter
    type: string
    required: false
    default: ""
    label:
      en_US: "Path filter (comma-separated, e.g. docs/,guides/**/*.md)"
      zh_Hans: "路徑過濾（逗號分隔，例如 docs/,guides/**/*.md）"
    placeholder:
      en_US: "docs/,guides/**/*.md"
      zh_Hans: "docs/,guides/**/*.md"
    description:
      en_US: Each entry is either a directory prefix ("docs/", matches everything under it) or a glob ("guides/**/*.md"). Leave empty to include every path.
      zh_Hans: 每個項目可以是目錄前綴（「docs/」，代表這個資料夾底下全部都算）或 glob 樣式（「guides/**/*.md」）。留空表示不限制路徑。
  - name: tag_filename_with_commit
    type: boolean
    required: false
    default: false
    label:
      en_US: Append content hash to file names
      zh_Hans: 在檔名加上內容雜湊
    description:
      en_US: >-
        Standalone option. ON: appends a short hash of the file's own content before its extension, e.g.
        "guide@a1b2c3d4e5f6.md". This is the file's git blob hash (content-based), NOT a commit hash - it
        changes only when this file's own content changes, never when other files in the repo change.
        Required together with "Verify against existing knowledge base documents" below for that feature
        to detect real content changes; alone it only affects the displayed name.
      zh_Hans: >-
        獨立選項，單獨開啟也有效。開啟後會在副檔名前加上這個檔案自己內容的雜湊，例如
        「guide@a1b2c3d4e5f6.md」。這是 git blob hash（內容雜湊），不是 commit hash——只有這個檔案自己的
        內容真的改變時才會變，repo 裡其他檔案改動不會影響它。要讓下面的「比對知識庫既有文件」能偵測真正的
        內容變化，這個選項必須跟它一起開啟；單獨開啟只會影響顯示的檔名。
  - name: use_dataset_verification
    type: boolean
    required: false
    default: false
    label:
      en_US: Verify against existing knowledge base documents (requires Dify API key below)
      zh_Hans: 比對知識庫既有文件（需要下面設定 Dify API key）
    description:
      en_US: >-
        Requires a Dify API key + API base URL (provider credentials) and the dataset ID below.
        OFF (default): lists every file matching the filters above on every run. ON: skips a file if a
        document with its exact name already exists in the target Knowledge Base. Whether that name
        includes a content hash depends on "Append content hash to file names" above - without it, a
        file is only ever synced once, no matter how its content later changes.
      zh_Hans: >-
        需要在 provider 憑證裡設定 Dify API key 跟 API 網址，以及下面的 dataset ID。關閉（預設）：每次
        執行都列出符合上方過濾條件的所有檔案。開啟：如果目標知識庫裡已經有同名文件，就跳過這個檔案。名稱
        是否包含內容雜湊，取決於上面的「在檔名加上內容雜湊」——沒開的話，檔案只會被同步一次，之後內容
        怎麼改都不會再同步。
  - name: dataset_id
    type: string
    required: false
    default: ""
    label:
      en_US: Target Knowledge Base dataset ID (only if Verify above is on)
      zh_Hans: 目標知識庫 dataset ID（僅在上面「比對」開啟時需要）
    placeholder:
      en_US: "6ac5d2f6-28d7-4f1a-94be-73a3aecc7370"
      zh_Hans: "6ac5d2f6-28d7-4f1a-94be-73a3aecc7370"
    description:
      en_US: >-
        Required only when "Verify against existing knowledge base documents" above is enabled - the
        plugin cannot discover it automatically. Find it in the target Knowledge Base's "Documents" page
        URL: https://your-dify-host/datasets/<dataset_id>/documents.
      zh_Hans: >-
        只有上方「比對知識庫既有文件」開啟時才需要——插件無法自動得知這個值。去目標知識庫的「文件」頁面看
        瀏覽器網址列：https://你的Dify網址/datasets/<dataset_id>/documents，中間那段 UUID 就是。
  - name: archive_superseded_versions
    type: boolean
    required: false
    default: false
    label:
      en_US: Archive superseded versions (requires both toggles above on)
      zh_Hans: 歸檔舊版本（需要上面兩個開關都打開）
    description:
      en_US: >-
        Requires both "Verify against existing knowledge base documents" and "Append content hash to
        file names" above - without both, there's no reliable way to tell "an older version of this
        file" apart from "a different file." When a file's current content is confirmed being ingested,
        any other document for the same file (tagged with an older content hash) gets archived - soft-
        disabled via the Dify Dataset API, not deleted - as part of the same pipeline run.
      zh_Hans: >-
        需要同時開啟上面的「比對知識庫既有文件」與「在檔名加上內容雜湊」——沒有這兩個，無法可靠分辨「這是
        同一個檔案的舊版本」還是「根本是不同的檔案」。當某個檔案的目前內容確認正在被同步時，這個檔案其他
        帶著較舊內容雜湊的文件會被歸檔——是透過 Dify Dataset API 軟性下架，不是刪除，跟同步新版本在同一次
        pipeline 執行裡完成。

output_schema:
  type: object
  properties:
    workspace_id:
      type: string
      description: Identifier for the configured repository + branch
    page_id:
      type: string
      description: Opaque identifier encoding the source commit, content hash, branch and file path
    content:
      type: string
      description: The file's raw text content

extra:
  python:
    source: datasources/git.py
